[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noisegen"
version = "0.1.0"
description = "A noise generation library for Minecraft terrain"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]